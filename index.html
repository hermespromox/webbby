    <meta name="description" content="Webbby aide les équipes sales à qualifier un prospect depuis son site web : fit B2B, client cible, signaux d'achat, angle d'approche et preuves concrètes." />
    <meta name="keywords" content="qualification prospect, prospection B2B, sales intelligence, analyse site web entreprise, lead scoring, outbound sales, account research, CRM" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="googlebot" content="index,follow" />
    <meta name="theme-color" content="#FF4801" />
    <link rel="canonical" href="https://webbby.artikle.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://webbby.artikle.org/" />
    <meta property="og:title" content="Webbby — Brief sales instantané depuis un site web" />
    <meta property="og:description" content="Collez le site d'un prospect. Webbby ressort les signaux commerciaux utiles pour prioriser, qualifier et contacter le bon compte." />
    <meta property="og:site_name" content="Webbby" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Webbby — Qualifiez vos prospects depuis leur site web" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Webbby",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://webbby.artikle.org/",
        "description": "Outil de qualification commerciale qui analyse le site web d'un prospect pour produire un brief sales actionnable.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "featureList": [
          "Qualification de prospects B2B depuis leur site web",
          "Signaux commerciaux personnalisables",
          "Brief sales avec preuves et niveau de confiance",
          "Priorisation de comptes pour l'outreach"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "À quoi sert Webbby pour une équipe sales ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Webbby lit le site d'un prospect et ressort les signaux utiles pour décider s'il faut le contacter, avec quel angle et quel niveau de priorité." }
          },
          {
            "@type": "Question",
            "name": "Quels signaux Webbby peut-il vérifier ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Fit B2B, client cible, budget, intention d'achat, maturité commerciale, segment, urgence, positionnement et concurrence." }
          },
          {
            "@type": "Question",
            "name": "Webbby remplace-t-il un commercial ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Non. Webbby prépare la recherche compte et le brief de prospection avant l'appel ou l'email." }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
