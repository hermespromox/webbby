    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Webbby",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://webbby.artikle.org/",
        "description": "Outil de qualification commerciale qui analyse le site web d'un prospect pour produire un brief sales actionnable en 10 secondes.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "featureList": [
          "Qualification de prospects B2B depuis leur site web en 10 secondes",
          "Signaux commerciaux personnalisables : fit, cible, achat, angle, preuves",
          "Brief sales lisible avec niveau de confiance et preuves concrètes",
          "Priorisation de comptes pour l'outreach sans recherche manuelle"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "À quoi sert Webbby pour une équipe sales ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Webbby lit le site d'un prospect et ressort les signaux utiles pour décider s'il faut le contacter, avec quel angle et quel niveau de priorité — en 10 secondes." }
          },
          {
            "@type": "Question",
            "name": "Quels signaux Webbby peut-il vérifier ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Fit B2B, client cible, signaux d'achat, maturité commerciale, angle d'approche, urgence et preuves concrètes tirées du site." }
          },
          {
            "@type": "Question",
            "name": "Webbby remplace-t-il un commercial ?",
            "acceptedAnswer": { "@type": "Answer", "text": "Non. Webbby prépare la recherche compte et le brief de prospection avant l'appel ou l'email. Il accélère la qualification, il ne la remplace pas." }
          }
        ]
      }
    </script>
